name: codipo-release
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - pandas=2.2.2
  - openpyxl=3.1.5
  - pillow=10.2.0
  - scikit-learn=1.5.2
  - scipy=1.14.1
  - matplotlib=3.10.1
  - pymupdf=1.27.2.3
  - nltk=3.9.1
  - pip:
      - transformers==4.56.2
      - trl==0.27.1
      - peft==0.17.1
      - "datasets>=3.0.0,<5"
      - "accelerate>=1.4.0,<2"
      - "safetensors>=0.4.3,<1"
      - "modelscope>=1.20.0,<2"
      - -e .

